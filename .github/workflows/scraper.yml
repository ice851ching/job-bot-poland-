name: scraper

on:
  schedule:
    # Запуск каждые 30 минут (:00 и :30) с 06:00 до 21:59 по UTC
    # По Польше это как раз примерно с 08:00 до 23:00 (с учетом летнего/зимнего времени)
    - cron: "0,30 6-21 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "City to scrape on demand"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-scraper.txt

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.city }}" ]; then
            echo "Running on-demand scrape for city: ${{ github.event.inputs.city }}"
            python scraper.py --city "${{ github.event.inputs.city }}"
          else
            echo "Running scheduled scrape"
            python scraper.py
          fi
