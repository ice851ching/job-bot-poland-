name: scraper

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City to scrape on demand"
        required: false
        default: ""

# Не дает запустить 2 парсера одновременно
concurrency:
  group: scraper-group
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-scraper.txt

      - name: Install dependencies
        run: pip install -r requirements-scraper.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.city }}" ]; then
            echo "Running on-demand scrape for city: ${{ github.event.inputs.city }}"
            python scraper.py --city "${{ github.event.inputs.city }}"
          else
            echo "Running full scrape for all active cities"
            python scraper.py
          fi
